<!DOCTYPE html>
<html lang="ro" class="canvas">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graful principal — Solomonar</title>
  <meta name="description" content="Graf interactiv: parlamentari și persoane care administrează firme cu contracte de stat.">
  <link rel="stylesheet" href="solomonar.css">
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; overflow: hidden; }

    .bar { display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; padding: 12px var(--gutter); border-bottom: 1px solid var(--line); }
    .bar form { display: flex; gap: 8px; flex: 1 1 280px; max-width: 460px; }
    .bar .field { min-height: 40px; padding: 8px 12px; font-size: 15px; }
    .bar .stats { margin: 0 0 0 auto; }

    .stage { position: relative; flex: 1; min-height: 0; }
    #sigma { position: absolute; inset: 0; }
    .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; color: var(--muted); z-index: 6; }

    .legend { position: absolute; left: 16px; bottom: 16px; z-index: 5; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
    .legend button { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 32px; padding: 0 6px; font: inherit; font-size: 14px; color: var(--ink); background: none; border: 0; border-radius: 4px; cursor: pointer; text-align: left; }
    .legend button:hover { background: var(--accent-soft); }
    .legend button[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; }
    .legend .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }

    .panel { position: absolute; right: 16px; top: 16px; z-index: 5; width: 320px; max-height: calc(100% - 32px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px; display: none; }
    .panel.show { display: block; }
    .panel h2 { font: 600 18px/1.3 var(--sans); margin: 8px 40px 10px 0; overflow-wrap: anywhere; }
    .panel dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 15px; }
    .panel dt { color: var(--muted); }
    .panel dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
    .panel h3 { font: 500 14px/1.3 var(--sans); color: var(--muted); margin: 16px 0 4px; padding-top: 12px; border-top: 1px solid var(--line); }
    .panel ul { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow: auto; }
    .panel li button { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 36px; padding: 4px 0; font: inherit; font-size: 15px; color: var(--ink); background: none; border: 0; border-bottom: 1px solid var(--line); cursor: pointer; text-align: left; }
    .panel li button:hover { color: var(--accent); }
    .panel .close { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; font-size: 22px; line-height: 1; color: var(--muted); background: none; border: 0; border-radius: 4px; cursor: pointer; }
    .panel .close:hover { color: var(--ink); background: var(--accent-soft); }

    @media (max-width: 640px) {
      .bar .stats { margin-left: 0; flex-basis: 100%; }
      .panel { left: 0; right: 0; top: auto; bottom: 0; width: auto; max-height: 55%; border-radius: 10px 10px 0 0; border-width: 1px 0 0; }
      .legend { left: 8px; bottom: 8px; }
      .panel.show ~ .legend { display: none; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="wordmark" href="index.html">Solomonar</a>
      <nav aria-label="Navigație principală">
        <a href="index.html">Acasă</a>
        <a href="search.html">Căutare</a>
        <a href="graf.html" aria-current="page">Graf</a>
        <a href="graf_full.html">Graful complet</a>
        <a href="https://solomonar.streamlit.app">Analiză detaliată</a>
        <a href="../data/v1/stats.json">Date</a>
      </nav>
    </div>
  </header>

  <div class="bar">
    <form id="find" role="search">
      <input class="field" type="search" id="q" placeholder="Caută o persoană sau o firmă în graf" aria-label="Caută în graf">
      <button class="button quiet" type="submit">Caută</button>
      <button class="button quiet" type="button" id="reset">Resetează</button>
    </form>
    <p class="note stats" id="stats" aria-live="polite"></p>
  </div>

  <main class="stage">
    <div id="sigma" role="img" aria-label="Graf cu parlamentari, administratori și firme cu contracte de stat"></div>
    <div class="overlay" id="loading">Se încarcă graful…</div>

    <aside class="panel" id="panel" aria-live="polite">
      <button class="close" id="panelClose" type="button" aria-label="Închide detaliile">×</button>
      <span class="tag" id="pKind"></span>
      <h2 id="pTitle"></h2>
      <dl id="pProps"></dl>
      <h3>Legături directe (<span id="pNcount">0</span>)</h3>
      <ul id="pNlist"></ul>
    </aside>

    <div class="legend" id="legend" role="group" aria-label="Arată sau ascunde tipuri de noduri">
      <button type="button" data-type="parlamentar" aria-pressed="true"><span class="dot" style="background:var(--node-parlamentar)"></span>parlamentar</button>
      <button type="button" data-type="persoana" aria-pressed="true"><span class="dot" style="background:var(--node-persoana)"></span>administrator</button>
      <button type="button" data-type="companie" aria-pressed="true"><span class="dot" style="background:var(--node-companie)"></span>firmă</button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/graphology@0.25.4/dist/graphology.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sigma@2.4.0/build/sigma.min.js"></script>
  <script>
  const DATA = "../data/v1";
  const TYPE_LABEL = { parlamentar: "parlamentar", persoana: "administrator", companie: "firmă" };
  const SELECTED_SCALE = 1.6;
  const ZOOM_ON_SELECT = 0.35;

  const $ = (id) => document.getElementById(id);
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = (n) => new Intl.NumberFormat("ro-RO").format(n);
  const norm = (s) => String(s ?? "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase();

  const COLORS = { persoana: css("--node-persoana"), parlamentar: css("--node-parlamentar"), companie: css("--node-companie") };
  const FADED = "#222a3b";
  const EDGE = "#2c3548";

  let renderer, graph, selected = null;
  const hidden = new Set();

  function fmtLei(v) {
    v = +v || 0;
    if (v >= 1e9) return (v / 1e9).toLocaleString("ro-RO", { maximumFractionDigits: 2 }) + " mld. lei";
    if (v >= 1e6) return (v / 1e6).toLocaleString("ro-RO", { maximumFractionDigits: 1 }) + " mil. lei";
    return fmt(Math.round(v)) + " lei";
  }

  async function load() {
    let data;
    try {
      const res = await fetch(`${DATA}/graf/graph_layout.json`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      data = await res.json();
    } catch (err) {
      $("loading").textContent = `Graful nu s-a putut încărca (${err.message}). Reîncarcă pagina.`;
      return;
    }

    $("stats").textContent = `${fmt(data.n_nodes)} noduri, ${fmt(data.n_edges)} legături, ${fmt(data.n_clusters)} grupuri`;

    graph = new graphology.Graph();
    for (const n of data.nodes) {
      graph.addNode(n.id, {
        x: n.x, y: -n.y, size: n.size, label: n.label, color: COLORS[n.type] || css("--muted"),
        ntype: n.type, contracte: n.contracte || 0, sector: n.sector || "", partid: n.partid || "", degree: n.degree || 0,
      });
    }
    for (const e of data.edges) {
      if (graph.hasNode(e.source) && graph.hasNode(e.target) && !graph.hasEdge(e.source, e.target)) {
        graph.addEdge(e.source, e.target, { size: 0.6, color: EDGE });
      }
    }

    renderer = new Sigma(graph, $("sigma"), {
      labelColor: { color: css("--ink") }, labelFont: "IBM Plex Sans, Segoe UI, sans-serif", labelSize: 13,
      labelDensity: 0.25, labelGridCellSize: 110, labelRenderedSizeThreshold: 10,
      defaultEdgeColor: EDGE, minCameraRatio: 0.05, maxCameraRatio: 14,
    });

    renderer.setSetting("nodeReducer", (node, d) => {
      const res = { ...d };
      if (hidden.has(d.ntype)) { res.hidden = true; return res; }
      if (selected) {
        if (node === selected) { res.zIndex = 2; res.size = d.size * SELECTED_SCALE; res.forceLabel = true; }
        else if (graph.areNeighbors(selected, node)) { res.zIndex = 1; res.forceLabel = true; }
        else { res.color = FADED; res.label = null; res.zIndex = 0; }
      }
      return res;
    });
    renderer.setSetting("edgeReducer", (edge, d) => {
      const res = { ...d };
      const [s, t] = graph.extremities(edge);
      if (hidden.has(graph.getNodeAttribute(s, "ntype")) || hidden.has(graph.getNodeAttribute(t, "ntype"))) { res.hidden = true; return res; }
      if (selected) {
        if (s === selected || t === selected) { res.color = css("--accent"); res.size = 1.2; }
        else res.hidden = true;
      }
      return res;
    });

    renderer.on("clickNode", ({ node }) => selectNode(node));
    renderer.on("clickStage", clearSelection);
    $("loading").hidden = true;
    $("loading").style.display = "none";
  }

  function selectNode(node, zoom) {
    selected = node;
    renderer.refresh();
    const a = graph.getNodeAttributes(node);
    $("pKind").textContent = TYPE_LABEL[a.ntype] || a.ntype;
    $("pKind").style.color = COLORS[a.ntype] || "";
    $("pKind").style.borderColor = "currentColor";
    $("pTitle").textContent = a.label;

    const rows = [["Legături", fmt(a.degree)]];
    if (a.contracte > 0) rows.push(["Contracte cu statul (brut)", fmtLei(a.contracte)]);
    if (a.partid) rows.push(["Partid", a.partid]);
    if (a.sector) rows.push(["Sector", a.sector]);
    $("pProps").innerHTML = rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");

    const nb = graph.neighbors(node)
      .map((id) => ({ id, label: graph.getNodeAttribute(id, "label") || "", type: graph.getNodeAttribute(id, "ntype") }))
      .sort((x, y) => x.label.localeCompare(y.label, "ro"));
    $("pNcount").textContent = nb.length;
    $("pNlist").innerHTML = nb.map((n) =>
      `<li><button type="button" data-id="${esc(n.id)}"><span class="dot" style="width:8px;height:8px;border-radius:50%;flex:none;background:${COLORS[n.type] || "currentColor"}"></span>${esc(n.label)}</button></li>`
    ).join("");
    $("panel").classList.add("show");
    if (zoom) renderer.getCamera().animate({ ...renderer.getNodeDisplayData(node), ratio: ZOOM_ON_SELECT }, { duration: 450 });
  }

  function clearSelection() {
    selected = null;
    $("panel").classList.remove("show");
    if (renderer) renderer.refresh();
  }

  $("pNlist").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-id]");
    if (btn) selectNode(btn.dataset.id, true);
  });
  $("panelClose").addEventListener("click", clearSelection);

  $("legend").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-type]");
    if (!btn || !renderer) return;
    const t = btn.dataset.type;
    const show = hidden.has(t);
    if (show) hidden.delete(t); else hidden.add(t);
    btn.setAttribute("aria-pressed", String(show));
    renderer.refresh();
  });

  $("find").addEventListener("submit", (e) => {
    e.preventDefault();
    if (!graph) return;
    const q = norm($("q").value.trim());
    if (!q) return;
    let hit = null;
    graph.forEachNode((id, a) => {
      if (hidden.has(a.ntype) || !norm(a.label).includes(q)) return;
      if (!hit || a.degree > graph.getNodeAttribute(hit, "degree")) hit = id;
    });
    if (hit) selectNode(hit, true);
    else $("stats").textContent = `Nimic în graf pentru „${$("q").value.trim()}”. Încearcă pagina Căutare, care acoperă toată baza.`;
  });

  $("reset").addEventListener("click", () => {
    $("q").value = "";
    clearSelection();
    if (renderer) renderer.getCamera().animatedReset();
  });

  load();
  </script>
</body>
</html>
