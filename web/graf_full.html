<!DOCTYPE html>
<html lang="ro" class="canvas">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graful complet — Solomonar</title>
  <meta name="description" content="Toate persoanele și firmele legate între ele, desenate pe placa grafică.">
  <link rel="stylesheet" href="solomonar.css">
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; overflow: hidden; }

    .bar { display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; padding: 12px var(--gutter); border-bottom: 1px solid var(--line); }
    .finder { position: relative; flex: 1 1 260px; max-width: 380px; }
    .finder .field { min-height: 40px; padding: 8px 12px; font-size: 15px; }
    #search-results { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 30; list-style: none; margin: 0; padding: 4px; max-height: 260px; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
    #search-results[hidden] { display: none; }
    #search-results button { display: block; width: 100%; min-height: 36px; padding: 6px 8px; font: inherit; font-size: 14px; color: var(--ink); background: none; border: 0; border-radius: 4px; cursor: pointer; text-align: left; }
    #search-results button:hover, #search-results button:focus-visible { background: var(--accent-soft); }
    #search-results small { color: var(--muted); }
    .bar .stats { margin: 0 0 0 auto; }

    .stage { position: relative; flex: 1; min-height: 0; }
    #graph { position: absolute; inset: 0; }
    #graph canvas { display: block; }
    .overlay { position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; background: var(--paper); color: var(--muted); }
    .overlay[hidden] { display: none; }

    .legend { position: absolute; left: 16px; bottom: 16px; z-index: 10; display: grid; grid-template-columns: auto auto; gap: 4px 16px; padding: 10px 14px; font-size: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
    .legend span { display: flex; align-items: center; gap: 8px; }
    .legend i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
    #status { position: absolute; right: 16px; bottom: 16px; z-index: 10; margin: 0; max-width: min(46ch, calc(100% - 32px)); padding: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }

    #tooltip { position: fixed; z-index: 40; pointer-events: none; max-width: 300px; padding: 10px 12px; font-size: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
    #tooltip[hidden] { display: none; }
    #tooltip strong { display: block; margin-bottom: 2px; }
    #tooltip span { color: var(--muted); }

    @media (max-width: 640px) {
      .bar .stats { margin-left: 0; flex-basis: 100%; }
      .legend { left: 8px; bottom: 8px; }
      #status { left: 8px; right: 8px; bottom: auto; top: 8px; max-width: none; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="wordmark" href="index.html">Solomonar</a>
      <nav aria-label="Navigație principală">
        <a href="index.html">Acasă</a>
        <a href="search.html">Căutare</a>
        <a href="graf.html">Graf</a>
        <a href="graf_full.html" aria-current="page">Graful complet</a>
        <a href="../data/v1/stats.json">Date</a>
      </nav>
    </div>
  </header>

  <div class="bar">
    <div class="finder">
      <input class="field" id="search" type="search" placeholder="Caută un nume în graf" autocomplete="off" aria-label="Caută un nod după nume">
      <ul id="search-results" hidden></ul>
    </div>
    <button class="button quiet" id="btn-pause" type="button">Oprește mișcarea</button>
    <button class="button quiet" id="btn-fit" type="button">Încadrează tot</button>
    <p class="note stats"><span id="stats"></span> <a id="scope-link" href="?toate=1"></a></p>
  </div>

  <main class="stage">
    <div id="graph" role="img" aria-label="Graf cu persoane și firme legate între ele"></div>
    <div class="legend" aria-label="Legendă">
      <span><i style="background:var(--node-parlamentar)"></i>parlamentar</span>
      <span><i style="background:var(--node-conflict)"></i>conflict declarat</span>
      <span><i style="background:var(--node-companie)"></i>firmă</span>
      <span><i style="background:var(--node-persoana)"></i>persoană</span>
    </div>
    <p class="note" id="status">Apasă pe un punct ca să-i vezi legăturile. Rotița mărește, tragerea mută harta.</p>
    <div class="overlay" id="loading">Se încarcă graful (aproximativ 21 MB)…</div>
  </main>

  <div id="tooltip" hidden></div>

<script type="module">
import { Graph } from "https://esm.sh/@cosmos.gl/graph@2.6.4";

const DATA_URL = "../data/v1/graf/graph_full.json";
const SPACE = 4096;               // limita cosmos.gl (WebGL)
const MIN_COMPONENT = 3;          // sub acest prag = pereche izolată, ascunsă implicit
const MAX_SEARCH_HITS = 25;
const HINT = "Apasă pe un punct ca să-i vezi legăturile. Rotița mărește, tragerea mută harta.";
const TYPE_LABEL = { parlamentar: "parlamentar", conflict: "conflict declarat", companie: "firmă", persoana: "persoană" };

const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const fmt = (n) => new Intl.NumberFormat("ro-RO").format(n);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = (s) => String(s ?? "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase();

function hexToRgb(hex) {
  const n = parseInt(hex.replace("#", ""), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
const COLOR_HEX = {
  parlamentar: css("--node-parlamentar"), conflict: css("--node-conflict"),
  companie: css("--node-companie"), persoana: css("--node-persoana"),
};
const FALLBACK_HEX = css("--muted");

function fmtLei(v) {
  v = +v || 0;
  if (v >= 1e9) return (v / 1e9).toLocaleString("ro-RO", { maximumFractionDigits: 2 }) + " mld. lei";
  if (v >= 1e6) return (v / 1e6).toLocaleString("ro-RO", { maximumFractionDigits: 1 }) + " mil. lei";
  return fmt(Math.round(v)) + " lei";
}

function showError(text) {
  $("loading").hidden = false;
  $("loading").textContent = text;
}

/* Păstrează doar nodurile din componente conexe cu cel puțin `minSize` noduri (union-find). */
function keepLargeComponents(nodes, links, minSize) {
  const index = new Map(nodes.map((n, i) => [n.id, i]));
  const parent = Int32Array.from(nodes, (_, i) => i);
  const find = (x) => { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
  const pairs = [];
  for (const l of links) {
    const s = index.get(l.source), t = index.get(l.target);
    if (s === undefined || t === undefined) continue;
    pairs.push([s, t]);
    const rs = find(s), rt = find(t);
    if (rs !== rt) parent[rs] = rt;
  }
  const size = new Int32Array(nodes.length);
  for (let i = 0; i < nodes.length; i++) size[find(i)]++;
  const remap = new Int32Array(nodes.length).fill(-1);
  const kept = [];
  for (let i = 0; i < nodes.length; i++) {
    if (size[find(i)] >= minSize) { remap[i] = kept.length; kept.push(nodes[i]); }
  }
  const keptPairs = pairs.filter(([s, t]) => remap[s] >= 0 && remap[t] >= 0).map(([s, t]) => [remap[s], remap[t]]);
  return { nodes: kept, pairs: keptPairs };
}

async function main() {
  let data;
  try {
    const resp = await fetch(DATA_URL);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    $("loading").textContent = "Se pregătește graful…";
    data = await resp.json();
  } catch (err) {
    showError(`Graful nu s-a putut încărca (${err.message}). Reîncarcă pagina.`);
    return;
  }

  const showAll = new URLSearchParams(location.search).has("toate");
  const { nodes, pairs } = keepLargeComponents(data.nodes, data.links, showAll ? 1 : MIN_COMPONENT);
  const N = nodes.length;
  const hiddenCount = data.nodes.length - N;

  $("stats").textContent = `${fmt(N)} noduri, ${fmt(pairs.length)} legături.`;
  const scope = $("scope-link");
  if (showAll) { scope.textContent = "Ascunde perechile izolate"; scope.href = location.pathname; }
  else if (hiddenCount) { scope.textContent = `Arată și cele ${fmt(hiddenCount)} din perechi izolate`; scope.href = "?toate=1"; }
  else scope.remove();

  const positions = new Float32Array(N * 2);
  const colors = new Float32Array(N * 4);
  const sizes = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    positions[i * 2] = Math.random() * SPACE;
    positions[i * 2 + 1] = Math.random() * SPACE;
    const [r, g, b] = hexToRgb(COLOR_HEX[nodes[i].type] || FALLBACK_HEX);
    colors.set([r / 255, g / 255, b / 255, 1], i * 4);
    sizes[i] = Math.min(2 + Math.sqrt(nodes[i].deg || 0) * 2.4, 22);
  }
  const linkArr = new Float32Array(pairs.length * 2);
  pairs.forEach(([s, t], k) => { linkArr[k * 2] = s; linkArr[k * 2 + 1] = t; });

  let running = true;
  const graph = new Graph($("graph"), {
    backgroundColor: css("--paper"),
    spaceSize: SPACE,
    pointSizeScale: 1,
    scalePointsOnZoom: true,
    renderLinks: true,
    linkColor: "rgba(151,161,178,0.2)",
    linkWidth: 0.4,
    linkArrows: false,
    pointGreyoutOpacity: 0.08,
    linkGreyoutOpacity: 0.02,
    hoveredPointCursor: "pointer",
    renderHoveredPointRing: true,
    hoveredPointRingColor: css("--ink"),
    focusedPointRingColor: css("--ink"),
    enableDrag: true,
    fitViewOnInit: false,
    simulationGravity: 0.18,
    simulationRepulsion: 0.9,
    simulationLinkSpring: 1.1,
    simulationLinkDistance: 6,
    simulationFriction: 0.86,
    simulationDecay: 2500,
    onClick: (index) => (index == null ? clearHighlight() : highlightNeighbors(index)),
    onPointMouseOver: (index, pos, event) => showTooltip(index, event),
    onPointMouseOut: hideTooltip,
    onSimulationEnd: () => { running = false; $("btn-pause").textContent = "Pornește mișcarea"; },
  });
  graph.setPointPositions(positions);
  graph.setPointColors(colors);
  graph.setPointSizes(sizes);
  graph.setLinks(linkArr);
  graph.render();
  graph.start();
  setTimeout(() => graph.fitView(800), 600);

  function showTooltip(index, event) {
    const n = nodes[index];
    if (!n) return;
    const tip = $("tooltip");
    tip.innerHTML = `<strong>${esc(n.label)}</strong><span>${esc(TYPE_LABEL[n.type] || n.type)}, ${fmt(n.deg || 0)} legături` +
      (n.contracte ? `<br>contracte cu statul (brut): ${esc(fmtLei(n.contracte))}` : "") +
      (n.directe ? `<br>achiziții directe: ${esc(fmtLei(n.directe))}` : "") + "</span>";
    tip.hidden = false;
    const x = event?.clientX ?? 0, y = event?.clientY ?? 0;
    tip.style.left = Math.min(x + 14, innerWidth - tip.offsetWidth - 8) + "px";
    tip.style.top = Math.min(y + 14, innerHeight - tip.offsetHeight - 8) + "px";
  }
  function hideTooltip() { $("tooltip").hidden = true; }

  function clearHighlight() {
    graph.unselectPoints?.();
    $("status").textContent = HINT;
  }

  function highlightNeighbors(index) {
    let adjacent = [];
    try { adjacent = graph.getAdjacentIndices(index) || []; } catch { adjacent = []; }
    graph.selectPointsByIndices?.([...new Set([index, ...adjacent])]);
    $("status").textContent = `${nodes[index].label}: ${fmt(adjacent.length)} legături evidențiate. Apasă pe fundal ca să anulezi.`;
  }

  const input = $("search"), results = $("search-results");
  input.addEventListener("input", () => {
    const q = norm(input.value.trim());
    const hits = [];
    if (q.length >= 2) {
      for (let i = 0; i < N && hits.length < MAX_SEARCH_HITS; i++) if (norm(nodes[i].label).includes(q)) hits.push(i);
    }
    results.hidden = !hits.length;
    results.innerHTML = hits.map((i) =>
      `<li><button type="button" data-idx="${i}">${esc(nodes[i].label)} <small>${esc(TYPE_LABEL[nodes[i].type] || nodes[i].type)}</small></button></li>`
    ).join("");
  });
  results.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-idx]");
    if (!btn) return;
    const idx = Number(btn.dataset.idx);
    results.hidden = true;
    input.value = nodes[idx].label;
    try { graph.zoomToPointByIndex?.(idx, 1500, 8); } catch { /* versiuni fără zoom pe punct */ }
    highlightNeighbors(idx);
  });
  document.addEventListener("click", (e) => { if (!e.target.closest(".finder")) results.hidden = true; });

  $("btn-pause").addEventListener("click", () => {
    if (running) graph.pause(); else graph.start();
    running = !running;
    $("btn-pause").textContent = running ? "Oprește mișcarea" : "Pornește mișcarea";
  });
  $("btn-fit").addEventListener("click", () => graph.fitView(600));

  $("loading").hidden = true;
}

main().catch((err) => showError(`Graful nu a pornit (${err?.message || err}). Pagina are nevoie de WebGL.`));
</script>
</body>
</html>
